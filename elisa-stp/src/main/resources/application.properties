# Quarkus build-time defaults. Runtime overlay: build/application.properties / dist/configs/.
stp.log.dir=logs
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.file.enable=false
quarkus.config.mapping.validate-unknown=false
# Stateless transit plane (DESIGN §1, §9.5): no datasource / ORM / Flyway —
# the fabric carries leases/admin/metrics only, never per-message state.
quarkus.http.port=8090
quarkus.http.host-enabled=false
# Admin HTTP (ra-http-server admin pack; admin-UI work package lands the routes).
http.ra.host=0.0.0.0
http.ra.port=8090
# SS7 plane (DESIGN §2). No stp.ss7.config-file / ss7.json present at boot
# keeps wireIfConfigured()=no-config; the admin apply path wires on demand.
stp.ss7.enabled=true
stp.ss7.host-ip=127.0.0.1
stp.ss7.host-port=8011
stp.ss7.peer-ip=127.0.0.1
stp.ss7.peer-port=8012
stp.ss7.opc=10
stp.ss7.dpc=20
stp.ss7.ip-channel-type=SCTP
# Transit profile (configs/stp.json — canRelay / removeSpc / incoming ACL / HA mode).
stp.transit.enabled=true
# Boot/health posture (P1): fail-on-wire-error=true makes a failed SS7 wire fatal at
# boot (production); require-ss7-live=true degrades /health to 503 DEGRADED when the
# M3UA route is not ready. Both default false for the lab (F-Stack lib optional).
stp.boot.fail-on-wire-error=false
stp.health.require-ss7-live=false
# HA fabric (DESIGN §4) — same artifact for both modes; mode is a config switch.
stp.ha.mode=active-active
stp.ha.node-id=stp-node-1
stp.ha.node-priority=100
stp.ha.lease-ttl-ms=3000
stp.ha.preemptive-failback=false
# Cluster fabric (jainslee-cluster on ISPN). enabled=false = local mode
# (no JGroups transport); leases/admin/metrics caches stay in-process.
stp.cluster.enabled=false
stp.cluster.stack=tcp
stp.cluster.initial-hosts=localhost[7800]
# SCTP fallback only — configs/ss7.json sctp.* wins at apply.
sctp.backend=FSTACK_DPDK
sctp.fstack.mode=IN_PROCESS
sctp.fstack.dataplane=LOOPBACK
sctp.fstack.inprocess.enabled=true
