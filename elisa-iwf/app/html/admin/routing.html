<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Routing — Elisa IWF</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('iwf-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* ignore */ }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {theme:{extend:{colors:{
      ink:{DEFAULT:'#0c1220',panel:'#141c2b',line:'#243044',mute:'#7a8ba3'},
      signal:{DEFAULT:'#e8a317',dim:'#b87f0f'}
    },fontFamily:{display:['"DM Sans"','system-ui','sans-serif'],mono:['"JetBrains Mono"','ui-monospace','monospace']}}}};
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="/admin/static/htmx.min.js"></script>
  <link rel="stylesheet" href="/admin/static/admin.css"/>
  <script defer src="/admin/static/iwf-shell.js"></script>
</head>
<body class="min-h-full bg-ink font-display text-slate-200 antialiased"
      style="background-image:radial-gradient(ellipse 80% 50% at 10% -10%,rgba(232,163,23,0.08),transparent),radial-gradient(ellipse 60% 40% at 100% 0%,rgba(56,100,160,0.12),transparent)">
  <header class="sticky top-0 z-40 border-b border-ink-line/80 bg-ink/90 backdrop-blur">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-3">
      <div class="flex items-center gap-3">
        <span class="h-8 w-1 rounded-full bg-signal" aria-hidden="true"></span>
        <h1 class="text-lg font-semibold text-slate-100">Routing — TS 29.305 mapping table</h1>
      </div>
      <nav class="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-ink-mute">{{NAV_LINKS}}</nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8">
    {{NOTICE}}
    <section aria-labelledby="routing-heading">
      <p class="text-xs uppercase tracking-[0.25em] text-signal">TS 29.305</p>
      <h2 id="routing-heading" class="mt-1 text-2xl font-semibold text-slate-50">MAP ↔ Diameter operation mapping</h2>
      <p class="mt-1 text-sm text-ink-mute">
        Each row pairs a MAP operation (TS 29.002) with its Diameter counterpart (S6a/S6d, TS 29.272).
        Status: <span class="inline-block rounded px-2 py-0.5 text-xs font-semibold bg-ink-mute/20 text-ink-mute">PLANNED</span>
        <span class="inline-block rounded px-2 py-0.5 text-xs font-semibold bg-signal/20 text-signal">MAPPED</span>
        <span class="inline-block rounded px-2 py-0.5 text-xs font-semibold bg-emerald-500/20 text-emerald-400">LAB_VERIFIED</span>
        * = required AVP
      </p>
    </section>

    <section class="mt-6" aria-labelledby="table-heading">
      <h3 id="table-heading" class="sr-only">Mapping table</h3>
      <div id="routing-table" class="rounded-lg border border-ink-line bg-ink-panel/80 overflow-x-auto"
           hx-get="/api/iwf/mappings" hx-trigger="load" hx-swap="innerHTML">Loading…</div>
    </section>
  </main>
</body>
</html>
