# IWF micro-jainslee — Quarkus application properties
quarkus.http.port=8090
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.file.enable=false
quarkus.config.mapping.validate-unknown=false

# IWF MAP leg (skeleton until M-IWF-3)
iwf.map.enabled=true
iwf.map.host-ip=127.0.0.1
iwf.map.host-port=8024
iwf.map.peer-ip=127.0.0.1
iwf.map.peer-port=8023
iwf.map.opc=250
iwf.map.dpc=10

# SCTP transport backend (lab: NETTY_KERNEL for loopback)
sctp.backend=NETTY_KERNEL
